name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version
          sw_vers

      - name: Build (debug)
        run: swift build -c debug

      - name: Run tests
        run: swift test

      - name: Build the .app bundle
        run: ./Scripts/build.sh

      - name: Verify .app exists
        run: |
          test -d build/IconPing.app/Contents/MacOS/IconPing -o -f build/IconPing.app/Contents/MacOS/IconPing
          codesign --verify --deep build/IconPing.app && echo "ad-hoc sign OK"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconPing-app-${{ github.sha }}
          path: build/IconPing.app
          if-no-files-found: error
